<style>
  :root{color-scheme:dark}
  html,body{margin:0;background:#0B0A07;color:#FFFFFF;-webkit-font-smoothing:antialiased}
  *{box-sizing:border-box}
  button{cursor:pointer;font-family:inherit;color:inherit}
  img{max-width:100%}
  .w-full{width:100%}.flex{display:flex}.flex-col{flex-direction:column}
  .grid{display:grid}.grid-cols-4{grid-template-columns:repeat(4,1fr)}
  .justify-center{justify-content:center}.justify-between{justify-content:space-between}
  .items-center{align-items:center}.items-baseline{align-items:baseline}
  .text-left{text-align:left}.text-center{text-align:center}
  .relative{position:relative}.fixed{position:fixed}.left-0{left:0}.right-0{right:0}.z-50{z-index:50}
  .max-w-md{max-width:28rem;margin-left:auto;margin-right:auto}
  .px-5{padding-left:1.25rem;padding-right:1.25rem}.pb-10{padding-bottom:2.5rem}
  .pt-6{padding-top:1.5rem}.pt-10{padding-top:2.5rem}.pt-12{padding-top:3rem}.pt-16{padding-top:4rem}.pt-20{padding-top:5rem}
  .mt-6{margin-top:1.5rem}.gap-2{gap:.5rem}

<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@600&display=swap');
  @keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(.96)}60%{transform:scale(1.03)}100%{transform:scale(1)}}
  .fade{animation:fadeUp .25s ease both}.pop{animation:pop .25s ease both}
  .disp{font-family:'Space Grotesk',sans-serif}.mono{font-family:'JetBrains Mono',monospace}
  .opt:active{transform:scale(.99)}
  /* — плавные и разные анимации переходов между этапами — */
  @keyframes slideFwd{from{opacity:0;transform:translateX(38px)}to{opacity:1;transform:none}}
  @keyframes slideBack{from{opacity:0;transform:translateX(-38px)}to{opacity:1;transform:none}}
  @keyframes riseIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
  @keyframes popIn{0%{opacity:0;transform:scale(.9)}60%{opacity:1;transform:scale(1.025)}100%{transform:scale(1)}}
  @keyframes zoomIn{from{opacity:0;transform:scale(1.05)}to{opacity:1;transform:none}}
  @keyframes qSlideR{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
  @keyframes qSlideL{from{opacity:0;transform:translateX(-24px)}to{opacity:1;transform:none}}
  .t-fwd{animation:slideFwd .44s cubic-bezier(.22,.61,.36,1) both}
  .t-back{animation:slideBack .44s cubic-bezier(.22,.61,.36,1) both}
  .t-up{animation:riseIn .46s cubic-bezier(.22,.61,.36,1) both}
  .t-pop{animation:popIn .52s cubic-bezier(.34,1.4,.64,1) both}
  .t-zoom{animation:zoomIn .46s cubic-bezier(.22,.61,.36,1) both}
  .q-r{animation:qSlideR .34s cubic-bezier(.22,.61,.36,1) both}
  .q-l{animation:qSlideL .34s cubic-bezier(.22,.61,.36,1) both}
  @media (prefers-reduced-motion: reduce){
    .t-fwd,.t-back,.t-up,.t-pop,.t-zoom,.q-r,.q-l,.fade,.pop{animation-duration:.01ms}
  }
  /* — золотые пасхалки — */
  @keyframes goldSweepAnim{0%{transform:translateX(-130%) skewX(-16deg);opacity:0}30%{opacity:.7}100%{transform:translateX(130%) skewX(-16deg);opacity:0}}
  @keyframes coinFall{0%{transform:translateY(-12vh) rotate(0);opacity:0}12%{opacity:1}100%{transform:translateY(112vh) rotate(720deg);opacity:.12}}
  @keyframes tipIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
  @keyframes goldPop{0%{transform:scale(.4);opacity:0}55%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
  .gold-sweep{position:fixed;inset:0;z-index:60;pointer-events:none;overflow:hidden}
  .gold-sweep::after{content:"";position:absolute;top:0;bottom:0;left:0;width:60%;
    background:linear-gradient(100deg,transparent,rgba(230,193,90,.10),rgba(230,193,90,.28),rgba(230,193,90,.10),transparent);
    animation:goldSweepAnim .8s cubic-bezier(.4,0,.2,1) both}
  .coin{position:fixed;top:0;z-index:65;pointer-events:none;animation:coinFall linear forwards;will-change:transform}
  .gold-tip{position:fixed;left:0;right:0;bottom:18px;z-index:61;display:flex;justify-content:center;pointer-events:none}
  .gold-tip>span{max-width:24rem;margin:0 16px;background:rgba(33,28,18,.96);border:1px solid #E6C15A;color:#E6C15A;
    font-size:12.5px;line-height:1.4;padding:9px 14px;border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.55);animation:tipIn .3s ease both}
  .egg-burst{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;pointer-events:auto;background:rgba(11,10,7,.35)}
  .egg-burst>div{background:rgba(20,17,9,.94);border:1px solid #E6C15A;border-radius:16px;padding:22px 26px;text-align:center;
    box-shadow:0 0 44px rgba(230,193,90,.4);animation:goldPop .5s ease both}
</style>

var xi={clubHandle:"@bahaxau",broker:"FXpro",fxproUrl:"https://fxpro-direct.com/ru/partner/Svmf4YX5?platform=web",tgUrl:"https://t.me/bahaxau",fxproLabel:"Зарегистрироваться на FXpro",tgLabel:"Telegram Бахи"},ma=l=>{let t=[],a=l[0];for(let u=0;u<l.length;u++){let i=l[u],e=a,n=u*37%5*.4+.6,c=Math.max(e,i)+n,f=Math.min(e,i)-(u*23%4*.4+.5);t.push([e,c,f,i]),a=i}return t},El="#34D399",oa="#F87171",sT={symbol:"XAUUSD · M15 · BUY",candles:ma([3316,3314,3311,3313,3309,3307,3308,3305,3303,3304,3302,3301,3302,3300,3301,3303,3302,3301]),entry:{from:3300,to:3303,label:"Вход"},levels:[{p:3324,label:"TP4",color:El},{p:3318,label:"TP3",color:El},{p:3313,label:"TP2",color:El},{p:3308,label:"TP1",color:El},{p:3293,label:"SL",color:oa}]},AT={symbol:"XAUUSD · M15",candles:ma([3312,3309,3307,3305,3303,3302,3301,3302,3300,3301,3302,3301,3300,3301,3302,3301]),entry:{from:3300,to:3303,label:"Зона ✓"},levels:[{p:3308,label:"TP1 ✕",color:oa},{p:3294,label:"SL ✕",color:oa}]},ET={symbol:"XAUUSD · M15 · трейлинг",candles:ma([3301,3303,3306,3308,3310,3309,3313,3315,3314,3318,3320,3319,3322,3323]),entry:{from:3300,to:3302,label:"Вход"},levels:[{p:3318,label:"TP3",color:El},{p:3313,label:"TP2",color:El},{p:3308,label:"TP1",color:El}],stepped:{points:[3294,3301,3308,3313],label:"стоп ↑"}},MT={symbol:"XAUUSD · M15 · 0.09",candles:ma([3314,3312,3310,3308,3306,3304,3303,3302,3301,3302,3300,3301,3302,3301,3300,3301]),entry:{from:3300,to:3303,label:"Вход 0.09"},levels:[{p:3318,label:"TP3·0.03",color:El},{p:3313,label:"TP2·0.03",color:El},{p:3308,label:"TP1·0.03",color:El},{p:3293,label:"SL",color:oa}]},on={from:4198,to:4202,label:"Вход"},TT={symbol:"XAUUSD · M15",candles:ma([4205,4203,4200,4198,4196,4194,4192,4190,4188,4187,4186,4186]),entry:on,levels:[{p:4215,label:"TP1",color:El},{p:4185,label:"SL ←",color:oa}]},uA={symbol:"XAUUSD · M15",candles:ma([4209,4206,4204,4202,4200,4201,4200,4199,4200,4201,4200,4200]),entry:on,levels:[{p:4230,label:"TP2",color:El},{p:4215,label:"TP1",color:El},{p:4185,label:"SL",color:oa}]},yT={symbol:"XAUUSD · M15",candles:ma([4200,4204,4209,4214,4216,4221,4226,4230,4229,4231]),entry:on,levels:[{p:4245,label:"TP3",color:El},{p:4230,label:"TP2 ←",color:El},{p:4215,label:"TP1",color:El},{p:4185,label:"SL",color:oa}]},iA={symbol:"XAUUSD · M15 · RR 1:2",candles:ma([4209,4206,4203,4201,4200,4201,4200,4199,4200,4201,4200,4200,4201,4200]),entry:on,levels:[{p:4230,label:"Цель +30",color:El},{p:4215,label:"TP1",color:El},{p:4185,label:"SL −15",color:oa}]},fa=[{id:"basics",icon:"🟢",title:"Основы трейдинга",sub:"сделка, TP, SL, плечо",lesson:[{t:"p",text:"Трейдинг — это покупка и продажа активов (золото, валюты, крипта) ради прибыли на изменении цены. Никакой магии: открыл сделку, цена пошла в нужную сторону — ты в плюсе, пошла против — в минусе."},{t:"h",text:"Из чего состоит сделка"},{t:"list",items:["Направление: BUY (покупка, ставка на рост) или SELL (продажа, ставка на падение).","Цена входа — по какой цене ты открыл сделку.","Тейк-профит (TP) — цена, где сделка закрывается в плюс.","Стоп-лосс (SL) — цена, где сделка закрывается в минус и дальше убыток не растёт."]},{t:"h",text:"Плечо и депозит"},{t:"p",text:"Депозит — твои деньги на твоём счёте у брокера. Плечо — заёмные средства брокера: позволяют открывать сделки больше депозита. Плечо усиливает и прибыль, и убыток, поэтому без риск-менеджмента оно опасно."},{t:"callout",text:"Главная мысль курса: ты здесь не для того, чтобы вслепую копировать, а чтобы понять, как всё устроено, и научиться торговать самому."}]},{id:"goal",icon:"🎯",title:"Цель: стать трейдером",sub:"учимся торговать, а не копировать",lesson:[{t:"img",src:Na.goal,cap:"Баха · @bahaxau — торговля на реальном счёте"},{t:"p",text:"Большинство «сигнальных» клубов делают из людей зависимых копировальщиков: пропал автор — пропал и заработок. У нас цель другая."},{t:"h",text:"Что мы строим"},{t:"p",text:"Сигналы Бахи — это твой тренажёр. Их нужно придерживаться: они дисциплинируют и дают реальную практику на живом рынке. Но за каждым сигналом стоит логика — почему именно этот вход, этот стоп, эта разбивка по лотам."},{t:"callout",text:"Цель — чтобы через реальные примеры ты со временем понимал рынок сам и мог торговать даже без Бахи."},{t:"h",text:"Как это работает на практике"},{t:"list",items:["Сначала повторяешь сделки и следуешь правилам — набираешь дисциплину и опыт.","Параллельно разбираешь каждый шаг: зачем перенос стопа, как считается лот, почему вход по правилам.","Со временем часть решений принимаешь сам и перестаёшь зависеть от одного источника."]},{t:"p",text:"Следовать сигналам — да. Оставаться вечным новичком, который без подсказки ничего не может — нет."}]},{id:"club",icon:"🔁",title:"Клуб и как вступить",sub:"FXpro, свой счёт, бесплатно",lesson:[{t:"p",text:"Баха ведёт закрытый клуб и публикует сигналы. Копи-трейдинг здесь ручной: Баха даёт сигнал — ты сам открываешь такую же сделку на своём счёте. Никакой автоматики."},{t:"h",text:"Ключевые факты"},{t:"list",items:["Ты торгуешь на своём личном счёте у брокера FXpro. У Бахи нет доступа к твоим деньгам.","Доступ в клуб бесплатный — через регистрацию на FXpro по ссылке Бахи.","Баха зарабатывает на комиссии брокера с твоих сделок, % с прибыли не берёт.","Будни — золото и форекс, выходные — крипта."]},{t:"h",text:"Три шага, чтобы начать"},{t:"list",items:["Регистрация на FXpro по ссылке (она в конце квиза).","Пополнение своего счёта.","Открытие сделок по сигналам — готовые параметры даёт Баха."]},{t:"callout",text:"Деньги всегда остаются у тебя на счёте. Ты в любой момент контролируешь свои средства."}]},{id:"signal",icon:"📍",title:"Как читать сигнал",sub:"BUY/SELL, тейки, стоп",lesson:[{t:"img",src:Na.signal,cap:"Разбор графика золота перед входом"},{t:"p",text:"Сигнал — это готовый план сделки. Твоя задача — повторить его на своём счёте."},{t:"h",text:"Что входит в сигнал"},{t:"list",items:["Направление: BUY или SELL.","Тикер (инструмент): например XAUUSD — золото.","Зона входа — цена/диапазон, по которому открывать сделку.","Тейки: TP1, TP2, TP3 (иногда TP4) — уровни фиксации прибыли.","Стоп-лосс (SL) — уровень защиты.","Риск: не более 1–2% от депозита."]},{t:"chart",spec:sT,cap:"Сигнал на графике: золотая зона входа, тейки TP1–TP4 сверху (зелёные) и стоп SL снизу (красный)."},{t:"h",text:"Что значат тейки"},{t:"p",text:"Позиция закрывается не вся сразу, а частями: на TP1 фиксируешь часть прибыли, на TP2 ещё часть, и так далее. Как именно делить позицию по лотам — в модуле про лоты."},{t:"callout",text:"Не понимаешь хотя бы один элемент сигнала — не входи. Сначала разберись."}]},{id:"lots",icon:"🧮",title:"Лоты и размер позиции",sub:"что такое лот и как делить",lesson:[{t:"p",text:"Лот — это размер твоей сделки, единица объёма. Чем больше лот, тем больше и прибыль, и убыток на каждый шаг цены. Поэтому лот нельзя брать «на глаз»."},{t:"h",text:"Лот считается под депозит"},{t:"p",text:"Размер лота зависит от твоего депозита и от того, где стоит стоп. Баха лично рассчитывает лот под каждый депозит — тебе не нужно гадать. Твоя задача — понимать логику, чтобы со временем считать самому."},{t:"h",text:"Пример на депозит $1000"},{t:"example",title:"Депозит $1000 · риск 2%",lines:["Риск на сделку: 2% от $1000 = $20","Примерный общий лот по золоту: 0.09","На 3 тейка: 0.03 + 0.03 + 0.03","На 4 тейка: 0.03 + 0.03 + 0.02 + 0.01","Сумма частей = 0.09 (тот же риск, просто разбит)"]},{t:"chart",spec:MT,cap:"Общий лот 0.09 делится по тейкам: по 0.03 на TP1, TP2 и TP3."},{t:"h",text:"Зачем делить лот по тейкам"},{t:"p",text:"Разбивка позволяет фиксировать прибыль постепенно: часть закрыл на TP1, часть на TP2 и так далее. Так ты забираешь прибыль на каждом уровне и снижаешь риск, что цена развернётся до того, как ты закрыл всё."},{t:"callout",text:"Точный лот под твой депозит даёт Баха. Цифры в примере — ориентир: реальный лот зависит от депозита и расстояния до стопа."}]},{id:"risk",icon:"🛡️",title:"Риск и гарантия",sub:"правило 1–2%, возврат депозита",lesson:[{t:"p",text:"Риск-менеджмент — это то, что отличает трейдера от игрока в казино. Главное правило клуба: рисковать не больше 1–2% депозита в одной сделке."},{t:"h",text:"Почему 1–2%"},{t:"p",text:"Даже у лучшего трейдера бывают убыточные сделки подряд. При риске 1–2% серия из нескольких стопов не разрушит счёт — ты остаёшься в игре. Зайдёшь на весь депозит — один стоп может его обнулить."},{t:"example",title:"Считаем риск",lines:["Депозит $1000 → 2% = $20 максимум потери","Депозит $500 → 2% = $10","Депозит $2000 → 2% = $40"]},{t:"h",text:"Гарантия возврата депозита"},{t:"p",text:"Если ты торговал строго по сигналам клуба и соблюдал риск 1–2%, но всё равно слил депозит — Баха возмещает его полностью. Это работает только при дисциплине: нарушил правила или рисковал больше — гарантия не действует."},{t:"callout",text:"Риск-менеджмент важнее любого «удачного» входа. Сначала защити депозит, потом думай о прибыли."}]},{id:"rr",icon:"⚖️",title:"Риск/прибыль (RR)",sub:"почему 1:2 работает, 1:1 — нет",lesson:[{t:"p",text:"RR (риск/прибыль, risk-reward) — это соотношение того, чем ты рискуешь, к тому, что можешь заработать в сделке. Запись 1:2 значит: рискуешь 1, цель — 2."},{t:"h",text:"Пример на золоте"},{t:"example",title:"Вход 4200 · SL 4185 · цель 4230",lines:["Риск до стопа: 15 пунктов","Тейки шагом 15: TP1 4215, TP2 4230, TP3 4245","Цель 30–45 пунктов при риске 15","RR ≈ 1:2 … 1:2.5"]},{t:"chart",spec:iA,cap:"Риск 15 пунктов вниз до стопа, цель +30 вверх — это RR 1:2."},{t:"h",text:"Почему 1:2 работает"},{t:"p",text:"При RR 1:2 одна прибыльная сделка перекрывает два убытка. Поэтому даже при точности около 40% на дистанции ты в плюсе: прибыль больше суммарных потерь. Не нужно угадывать каждую сделку — нужна математика на твоей стороне."},{t:"h",text:"Почему нельзя 1:1 или меньше"},{t:"list",items:["RR 1:1 — рискуешь столько же, сколько берёшь. Чтобы хотя бы не терять, надо стабильно выигрывать больше половины сделок, а с учётом комиссий — ещё больше. На дистанции это почти всегда минус.","RR меньше 1 (например 1:0.5) — рискуешь больше, чем зарабатываешь. Один стоп съедает несколько прибыльных сделок. Даже высокий процент побед не спасает."]},{t:"callout",text:"Поэтому сетапы берут только с RR от 1:2. Сначала смотрим на соотношение риск/прибыль — потом на вход."}]},{id:"entry",icon:"⏱️",title:"Правила входа",sub:"TP1 / стоп / 15 минут",lesson:[{t:"p",text:"Сигнал актуален не вечно. Войти «когда угодно» — частая ошибка новичка. Есть три правила, которые защищают от плохого входа."},{t:"h",text:"Когда НЕ входить"},{t:"list",items:["Цена уже дошла до первого тейка (TP1) или дальше — сигнал отработал, вход невыгоден.","Цена подошла вплотную к стопу — потенциальный убыток рядом, смысла нет."]},{t:"h",text:"Когда можно входить"},{t:"list",items:["Цена около зоны входа И прошло не больше 15 минут с момента публикации сигнала."]},{t:"callout",text:"Цена у зоны входа + не позже 15 минут = можно заходить. Всё остальное — пропускаем."},{t:"chart",spec:AT,cap:"Заходим только в золотой зоне входа. Если цена уже у TP1 или прижалась к стопу — вход пропускаем."},{t:"p",text:"После 15 минут условия на рынке уже изменились, и даже «подходящая» цена не делает сигнал актуальным. Дисциплина важнее желания обязательно влезть в сделку."}]},{id:"manage",icon:"🔧",title:"Сопровождение и перенос стопов",sub:"трейлинг + задержки",lesson:[{t:"img",src:Na.manage,cap:"Сопровождение сделки в течение дня"},{t:"p",text:"Войти — половина дела. Дальше сделку нужно сопровождать: вовремя переносить стоп, чтобы защитить прибыль. Важная деталь: команды Бахи иногда приходят с задержкой."},{t:"callout",text:"Поэтому есть консервативное правило переноса стопа, по которому ты действуешь сам, не дожидаясь команды."},{t:"h",text:"Правило переноса стопа (трейлинг)"},{t:"list",items:["После первого тейка (TP1) — стоп переносится в безубыток (на цену входа).","После второго тейка (TP2) — стоп переносится на уровень первого тейка (TP1).","После третьего тейка (TP3) — стоп переносится на уровень второго тейка (TP2)."]},{t:"chart",spec:ET,cap:"Зелёная ступенька — стоп ползёт вверх: к БУ после TP1, к TP1 после TP2, к TP2 после TP3."},{t:"p",text:"Так с каждым взятым тейком ты фиксируешь всё больше прибыли и даже при развороте цены выходишь в плюс, а не в минус."},{t:"h",text:"Следи за комментариями Бахи"},{t:"p",text:"Баха может вручную дать команду закрыть позицию или изменить её — например, при резком развороте. Пришла команда — действуешь по ней. Задержалась — работает консервативное правило переноса выше."},{t:"callout",text:"Базовая защита (TP/SL) + правило переноса стопа + комментарии Бахи. Вместе это и есть грамотное сопровождение."}]},{id:"psy",icon:"🧠",title:"Психология и самостоятельность",sub:"ожидания, дисциплина",lesson:[{t:"p",text:"Рынок проверяет не интеллект, а дисциплину и эмоции. Большинство сливают не из-за плохих сигналов, а из-за паники и жадности."},{t:"h",text:"Реалистичные ожидания"},{t:"p",text:"Средняя доходность участников клуба — порядка 20–30%. Это средний исторический результат, а не гарантия: у кого-то выше, у кого-то ниже. Прошлые результаты не обещают будущих."},{t:"h",text:"Чего не делать"},{t:"list",items:["Не «отыгрываться» увеличением ставки после убытка (мартингейл) — это путь к сливу.","Не паниковать на просадке — в рамках риск-менеджмента она нормальна.","Не нарушать правила входа и риска ради «красивого» входа."]},{t:"h",text:"Путь к самостоятельности"},{t:"p",text:"Чем больше сделок ты проходишь осознанно — понимая, почему вход, стоп, перенос и лот именно такие — тем меньше зависишь от подсказок. Цель не в том, чтобы вечно копировать, а в том, чтобы научиться торговать самому."},{t:"callout",text:"Дисциплина на дистанции бьёт любой «гениальный» разовый вход."}]},{id:"safe",icon:"🚩",title:"Безопасность",sub:"красные флаги и доверие",lesson:[{t:"p",text:"Где деньги — там и мошенники. Несколько правил, которые тебя защитят."},{t:"h",text:"Главные красные флаги"},{t:"list",items:["Обещание «гарантированной» прибыли без риска — так не бывает.","Просьба перевести деньги напрямую человеку на карту.","Просьба дать доступ к твоему счёту или «доверительное управление»."]},{t:"h",text:"Как у нас"},{t:"list",items:["Твои деньги — только на твоём счёте у FXpro.","У Бахи нет доступа к твоему счёту, он только даёт сигналы.","100% точных сигналов не существует — честный трейдер показывает и убытки."]},{t:"callout",text:"Если кто-то гарантирует прибыль или просит доступ к счёту — это развод. Точка."}]}],uo={title:"Как всё работает",sub:"минута контекста перед стартом",blocks:[{t:"img",src:Na.intro,cap:"Реальный трейдинг по золоту, форексу и крипте"},{t:"p",text:"Это не курс «нажми кнопку и разбогатей». Это обучение реальному трейдингу на живых примерах."},{t:"h",text:"Главная идея"},{t:"p",text:"Баха даёт сигналы по золоту, форексу и крипте — ты повторяешь их на своём счёте у FXpro. Сигналов нужно придерживаться: это дисциплина и практика. Но цель глубже."},{t:"callout",text:"Через реальные сделки ты учишься понимать рынок, чтобы со временем торговать самому — даже без Бахи."},{t:"h",text:"Что важно с самого начала"},{t:"list",items:["Ты торгуешь на своём счёте, у Бахи нет доступа к деньгам.","Риск — не больше 1–2% депозита в сделке.","Лот под твой депозит Баха считает лично.","Входишь по правилам и сопровождаешь сделку переносом стопа."]},{t:"p",text:"Ниже 10 коротких блоков с уроками и вопросами. Прошёл блок — стал на шаг ближе к самостоятельной торговле."}]},pT={basics:[{q:"Что такое стоп-лосс (SL)?",o:["Уровень, где сделка закрывается с убытком и дальше потери не растут","Уровень фиксации прибыли","Размер депозита","Реферальная ссылка"],c:0,e:"Стоп-лосс закрывает сделку при заданной цене и ограничивает убыток. Тейк-профит — наоборот, закрывает в плюс."},{q:"Что такое «плечо» (leverage)?",o:["Заёмные средства брокера, которые увеличивают и прибыль, и риск","Подарок от брокера","Гарантия прибыли","Взнос за клуб"],c:0,e:"Плечо позволяет открывать сделки больше депозита. Оно усиливает и прибыль, и убыток — поэтому риск-менеджмент обязателен."},{q:"Что означает BUY в сделке?",o:["Открыть сделку в расчёте на рост цены (покупка)","Закрыть все сделки","Вывести деньги","Пополнить счёт"],c:0,e:"BUY — покупка, ставка на рост. SELL — продажа, ставка на падение."},{q:"Какая главная цель этого обучения?",o:["Понять рынок и со временем торговать самому","Просто копировать вслепую","Отдать деньги в управление","Ничего не делать и ждать прибыль"],c:0,e:"Сигналы — это тренажёр. Цель — через практику стать самостоятельным трейдером."}],goal:[{q:"В чём ключевая цель клуба?",o:["Через практику сделать из тебя самостоятельного трейдера","Сделать тебя навсегда зависимым от автора","Продать дорогой курс","Забрать процент с твоей прибыли"],c:0,e:"Сигналы — инструмент обучения. Главное — чтобы ты научился торговать сам."},{q:"Нужно ли следовать сигналам Бахи?",o:["Да — их придерживаются, это дисциплина и практика","Нет, лучше игнорировать","Только по настроению","Делать наоборот"],c:0,e:"Сигналам нужно следовать: это тренажёр. Но параллельно ты учишься понимать, почему так."},{q:"Что значит «не быть копиркой»?",o:["Понимать логику сделок, чтобы со временем торговать без подсказок","Никогда не смотреть сигналы","Торговать вслепую","Копировать чужие скриншоты"],c:0,e:"Понимаешь, почему вход, стоп и лот именно такие — значит, растёшь в самостоятельного трейдера."},{q:"Если цель достигнута, а автор пропал — что с твоим заработком?",o:["Ты сможешь торговать сам","Заработок сразу исчезнет","Счёт закроется","Деньги пропадут"],c:0,e:"В этом и смысл обучения: ты становишься независимым и торгуешь даже без Бахи."}],club:[{q:"На каком счёте ты торгуешь?",o:["На своём личном счёте у брокера FXpro","На счёте Бахи","На общем счёте клуба","На счёте с доступом Бахи"],c:0,e:"Только твой счёт у FXpro. У Бахи нет доступа к твоим деньгам."},{q:"Сколько стоит доступ в клуб?",o:["Бесплатно — через регистрацию на FXpro по ссылке","Платная подписка","Разовый взнос","Процент с прибыли"],c:0,e:"Клуб бесплатный. Подписок и оплат за в икто, лот не важен"],c:0,e:"Баха считает лот под каждый депозит. Твоя задача — понимать логику, чтобы со временем считать самому."},{q:"Депозит $1000, риск 2%. Сколько это в деньгах?",o:["$20","$200","$100","$2"],c:0,e:"2% от $1000 = $20 — максимальная потеря в сделке."},{q:"Общий лот по золоту на $1000 — 0.09. Как делят на 3 тейка?",o:["По 0.03 на каждый тейк","По 0.09 на каждый тейк","По 0.30 на каждый","Случайным образом"],c:0,e:"0.09 делится поровну: 0.03 + 0.03 + 0.03. На 4 тейка — 0.03 + 0.03 + 0.02 + 0.01."},{q:"Зачем делить лот по тейкам?",o:["Чтобы фиксировать прибыль частями на каждом уровне","Чтобы запутаться","Чтобы увеличить риск","Без причины"],c:0,e:"Разбивка даёт забирать прибыль постепенно и снижает риск разворота до полного закрытия."}],risk:[{q:"Сколько рискуешь в одной сделке по правилам клуба?",o:["1–2% от депозита","50% от депозита","Весь депозит","Сколько угодно"],c:0,e:"Только 1–2% депозита в сделке. Это позволяет пережить серию убытков."},{q:"Почему нельзя заходить на весь депозит?",o:["Один стоп может обнулить счёт","Так быстрее без риска","Это требование биржи","Чтобы меньше комиссия"],c:0,e:"При большом риске один стоп уничтожит счёт. 1–2% сохраняют тебя в игре."},{q:"Депозит $500, риск 2% — это сколько?",o:["$10","$100","$50","$5"],c:0,e:"2% от $500 = $10 — потолок убытка в сделке."},{q:"Когда работает гарантия возврата депозита?",o:["Если торговал строго по сигналам с риском 1–2%","Всегда, что бы ты ни делал","Если торговал по своим идеям","Если рисковал больше 2%"],c:0,e:"Гарантия — только при дисциплине: строго по сигналам и с риском 1–2%."},{q:"Что важнее в трейдинге?",o:["Сначала защитить депозит, потом думать о прибыли","Сначала максимальная прибыль","Большой лот","Много сделок в день"],c:0,e:"Риск-менеджмент важнее любого удачного входа. Защита депозита — первична."}],rr:[{q:"Что такое риск/прибыль (RR) в сделке?",o:["Соотношение возможного убытка к возможной прибыли","Размер депозита","Количество тейков","Комиссия брокера"],c:0,e var SVG_NS = "http://www.w3.org/2000/svg";
var SVG_TAGS = { svg: 1, g: 1, line: 1, rect: 1, text: 1, path: 1 };
var SVG_ATTR = {
  strokeWidth: "stroke-width",
  strokeDasharray: "stroke-dasharray",
  fontSize: "font-size",
  fontFamily: "font-family",
  fontWeight: "font-weight",
  textAnchor: "text-anchor",
};
var UNITLESS = { opacity: 1, zIndex: 1, fontWeight: 1, lineHeight: 1, flex: 1, flexGrow: 1, flexShrink: 1, order: 1 };

function appendChild(el, ch) {
  if (ch == null || ch === false || ch === true) return;
  if (Array.isArray(ch)) {
    for (var i = 0; i < ch.length; i++) appendChild(el, ch[i]);
    return;
  }
  if (ch instanceof Node) {
    el.appendChild(ch);
    return;
  }
  el.appendChild(document.createTextNode(String(ch)));
}

function applyStyle(el, style) {
  for (var k in style) {
    var v = style[k];
    if (v == null) continue;
    if (typeof v === "number" && !UNITLESS[k]) v = v + "px";
    el.style[k] = v;
  }
}

// h(tag, props, ...children) — создаёт реальный DOM-узел (аналог JSX-элемента)
function h(tag, props) {
  var isSvg = SVG_TAGS[tag];
  var el = isSvg ? document.createElementNS(SVG_NS, tag) : document.createElement(tag);
  if (props) {
    for (var k in props) {
      var v = props[k];
      if (v == null) continue;
      if (k === "children") {
        appendChild(el, v);
      } else if (k === "className") {
        el.setAttribute("class", v);
      } else if (k === "style" && typeof v === "object") {
        applyStyle(el, v);
      } else if (k.slice(0, 2) === "on" && typeof v === "function") {
        el.addEventListener(k.slice(2).toLowerCase(), v);
      } else if (isSvg) {
        el.setAttribute(SVG_ATTR[k] || k, v);
      } else if (k === "disabled") {
        if (v) el.setAttribute("disabled", "");
      } else {
        el.setAttribute(k, v);
      }
    }
  }
  for (var i = 2; i < arguments.length; i++) appendChild(el, arguments[i]);
  return el;
}

function lsGet(k, def) { try { var v = localStorage.getItem(k); return v == null ? def : v; } catch (e) { return def; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

function resolveIdentity() {
  // 1) Telegram Mini App — автологин
  try {
    var wa = window.Telegram && window.Telegram.WebApp;
    if (wa && wa.initDataUnsafe && wa.initDataUnsafe.user) {
      wa.ready(); try { wa.expand(); } catch (e) {}
      Identity.user = wa.initDataUnsafe.user;
      Identity.source = "miniapp";
      lsSet("baha_user", JSON.stringify(Identity.user));
      return;
    }
  } catch (e) {}
  // 2) Сохранённый ранее вход через виджет
  var saved = lsGet("baha_user", "");
  if (saved) {
    try { Identity.user = JSON.parse(saved); Identity.source = "widget"; return; } catch (e) {}
  }
  // 3) Гость с анонимным стабильным id
  var gid = lsGet("baha_guest", "");
  if (!gid) { gid = "g" + Math.random().toString(36).slice(2, 10); lsSet("baha_guest", gid); }
  Identity.user = { id: gid, username: null, first_name: "Гость" };

/* ── Аналитика воронки ──────────────────────────────────────────────── */
var SESSION_ID = "s" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
var EVENT_LOG_KEY = "baha_events";

function readLocalEvents() {
  try { return JSON.parse(lsGet(EVENT_LOG_KEY, "[]")) || []; } catch (e) { return []; }
}
function pushLocalEvent(ev) {
  var arr = readLocalEvents();
  arr.push(ev);
  if (arr.length > 1000) arr = arr.slice(arr.length - 1000); // не раздуваем хранилище
  lsSet(EVENT_LOG_KEY, JSON.stringify(arr));
}

function track(event, props) {
  var u = Identity.user || {};
  var ev = {
    ts: Date.now(),
    session: SESSION_ID,
    uid: String(u.id || "anon"),
    uname: u.username || "",
    src: Identity.source,
    event: event,
    props: props || {},
  };
  pushLocalEvent(ev);                 // локальный лог (для офлайн-дашборда и фоллбэка)
  if (CONFIG.statsEndpoint) sendEvent(ev); // глобально в Google Apps Script
}

// Отправка события: text/plain → «простой» запрос без preflight; no-cors fire-and-forget
function sendEvent(ev) {
  try {
    fetch(CONFIG.statsEndpoint, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify(ev),
      keepalive: true,
    }).catch(function () {});
  } catch (e) {}
}

// Чтение агрегатов из Apps Script через JSONP (обходит CORS на GET)
function fetchFunnelGlobal(cb) {
  if (!CONFIG.statsEndpoint) { cb(null); return; }
  var cbName = "__bahaFunnel" + Date.now().toString(36);
  var done = false;
  window[cbName] = function (data) { done = true; cleanup(); cb(data); };
  var s = document.createElement("script");
  s.src = CONFIG.statsEndpoint + (CONFIG.statsEndpoint.indexOf("?") === -1 ? "?" : "&") + "action=funnel&callback=" + cbName;
  s.onerror = function () { cleanup(); cb(null); };
  function cleanup() { try { delete window[cbName]; } catch (e) { window[cbName] = undefined; } if (s.parentNode) s.parentNode.removeChild(s); }
  document.body.appendChild(s);
  setTimeout(function () { if (!done) { cleanup(); cb(null); } }, 8000);
}

// Локальный расчёт воронки (по событиям этого устройства)
function computeFunnelLocal() {
  var evs = readLocalEvents();
  var usersByEvent = {}, countByEvent = {};
  var modAgg = {}; // {moduleId: {opens, completes, sumCorrect, sumTotal}}
  evs.forEach(function (e) {
    countByEvent[e.event] = (countByEvent[e.event] || 0) + 1;
    (usersByEvent[e.event] = usersByEvent[e.event] || {})[e.uid] = 1;
    var mid = e.props && e.props.moduleId;
    if (mid) {
      var m = modAgg[mid] = modAgg[mid] || { opens: 0, completes: 0, sumCorrect: 0, sumTotal: 0 };
      if (e.event === "module_open") m.opens++;
      if (e.event === "module_complete") { m.completes++; m.sumCorrect += (e.props.correct || 0); m.sumTotal += (e.props.total || 0); }
    }
  });
  var events = {};
  Object.keys(usersByEvent).forEach(function (k) { events[k] = { users: Object.keys(usersByEvent[k]).length, count: countByEvent[k] || 0 }; });
  var allUid = {}; evs.forEach(function (e) { allUid[e.uid] = 1; });
  return { events: events, modules: modAgg, totalUsers: Object.keys(allUid).length, scope: "local" };
}

/* ── Обработчики (заменяют callbacks внутри компонента) ─────────────── */
function openModule(idx) {
  App.modIdx = idx;
  App.quiz = dT(fa[idx].id);
  App.qIdx = 0;
  App.sel = null;
  App.answered = false;
  App.moduleCorrect = 0;
  track("module_open", { moduleId: fa[idx].id });
  go("lesson");
}

function choose(idx) {
  if (App.answered) return;
  App.sel = idx;
  App.answered = true;
  var q = App.quiz[App.qIdx];
  if (idx === q.correct) {
    var ns = App.streak + 1;
    var add = 10;
    if (ns % 3 === 0) add += 5;
    var oldLvl = io(App.xp).idx;
    var newLvl = io(App.xp + add).idx;
    App.xp += add;
    App.streak = ns;
    App.maxStreak = Math.max(App.maxStreak, ns);
    App.moduleCorrect += 1;
    if (ns >= 5) addBadge("wave");
    if (newLvl > oldLvl) {
      setTimeout(function () { showToast(fn[newLvl].icon + " Новый уровень: " + fn[newLvl].name); }, 300);
    }
  } else {
    App.streak = 0;
  }
  track("quiz_answer", { moduleId: fa[App.modIdx].id, q: App.qIdx, correct: idx === q.correct });
  render();
}

function nextQuestion() {
  if (App.qIdx < App.quiz.length - 1) {
    App.qIdx += 1;
    App.sel = null;
    App.answered = false;
    goldSweep();
    render();
    return;
  }
  var correct = App.moduleCorrect;
  var total = App.quiz.length;
  var perfect = correct === total;
  var mod = fa[App.modIdx];
  if (!App.done.some(function (x) { return x.id === mod.id; })) {
    App.done.push({ id: mod.id, correct: correct, total: total });
  }
  if (App.modIdx === 0) addBadge("first");
  if (perfect) addBadge("perfect");
  if (perfect && mod.id === "lots") addBadge("calc");
  if (perfect && mod.id === "risk") addBadge("risk");
  if (perfect && mod.id === "rr") addBadge("rr");
  if (perfect && mod.id === "entry") addBadge("entry");
  if (perfect && mod.id === "manage") addBadge("manage");
  if (perfect && mod.id === "safe") addBadge("detective");
  track("module_complete", { moduleId: mod.id, correct: correct, total: total });
  if (App.done.length === fa.length) track("all_modules_done");
  go("moduleResult");
}

function afterResult() {
  if (App.modIdx < fa.length - 1) {
    go("map");
  } else {
    addBadge("grad");
    go("final");
  }
}

function restart() {
  App.screen = "start";
  App.modIdx = 0;
  App.qIdx = 0;
  App.sel = null;
  App.answered = false;
  App.xp = 0;
  App.streak = 0;
  App.maxStreak = 0;
  App.moduleCorrect = 0;
  App.done = [];
  App.badges = [];
  App.quiz = [];
  goldSweep();
  render();
}

// SVG-график свечей (eA)
function Chart(spec) {
  var t = spec.symbol || "XAUUSD · M15";
  var a = spec.candles;
  var u = spec.entry;
  var i = spec.levels || [];
  var e = spec.stepped;
  var n = 340, c = 196, f = 64, m = 16, y = 14, A = 6;
  var M = n - f, hh = m, g = c - y;
  var z = [];
  a.forEach(function (U) { z.push(U[1], U[2]); });
  if (u) z.push(u.from, u.to);
  i.forEach(function (U) { z.push(U.p); });
  if (e) e.points.forEach(function (U) { z.push(U); });
  var s = Math.min.apply(null, z);
  var o = Math.max.apply(null, z);
  var E = (o - s) * 0.06 || 1;
  s -= E; o += E;
  var p = function (U) { return hh + ((o - U) / (o - s)) * (g - hh); };
  var R = a.length;
  var Z = (M - A) / R;
  var Y = Math.max(2, Z * 0.55);

  var kids = [];
  // горизонтальная сетка
  [0, 1, 2, 3, 4].forEach(function (U) {
    var V = hh + ((g - hh) * U) / 4;
    kids.push(h("line", { x1: A, x2: M, y1: V, y2: V, stroke: "#2a2417", strokeWidth: "0.5" }));
  });
  // вертикальная сетка
  [0, 1, 2, 3, 4, 5].forEach(function (U) {
    var V = A + ((M - A) * U) / 5;
    kids.push(h("line", { x1: V, x2: V, y1: hh, y2: g, stroke: "#211c12", strokeWidth: "0.5" }));
  });
  // зона входа
  if (u) {
    kids.push(h("g", null,
      h("rect", { x: A, y: p(u.to), width: M - A, height: Math.max(2, p(u.from) - p(u.to)), fill: "#E8B94A", opacity: "0.14" }),
      h("line", { x1: A, x2: M, y1: p(u.to), y2: p(u.to), stroke: "#E8B94A", strokeWidth: "0.6", strokeDasharray: "3 2", opacity: "0.6" }),
      h("line", { x1: A, x2: M, y1: p(u.from), y2: p(u.from), stroke: "#E8B94A", strokeWidth: "0.6", strokeDasharray: "3 2", opacity: "0.6" }),
      h("rect", { x: M + 2, y: (p(u.from) + p(u.to)) / 2 - 6.5, width: f - 5, height: 13, rx: 3, fill: "#E8B94A" }),
      h("text", { x: M + 6, y: (p(u.from) + p(u.to)) / 2 + 3.2, fontSize: "7.5", fill: "#100c04", fontFamily: "monospace", fontWeight: "700" }, u.label)
    ));
  }
  // свечи
  a.forEach(function (U, V) {
    var r = A + Z * V + Z / 2;
    var j = U[0], ul = U[1], mt = U[2], Gt = U[3];
    var color = Gt >= j ? "#34D399" : "#F87171";
    var sn = Math.min(p(j), p(Gt));
    var bh = Math.max(1.4, Math.abs(p(Gt) - p(j)));
    var wick = h("line", { x1: r, x2: r, y1: p(ul), y2: p(mt), stroke: color, strokeWidth: "0.8" });
    var body = h("rect", { x: r - Y / 2, y: sn, width: Y, height: bh, fill: color });
    // последняя свеча — «живая»: её тикает тикер (см. startCandleTickers)
    if (V === a.length - 1) {
      wick.setAttribute("data-live-wick", "1");
      body.setAttribute("data-live-body", "1");
      body.setAttribute("data-open", p(j));     // координата открытия
      body.setAttribute("data-close", p(Gt));   // координата текущей цены
      body.setAttribute("data-hi", p(ul));      // координата хая
      body.setAttribute("data-lo", p(mt));      // координата лоя
      body.setAttribute("data-up", color === "#34D399" ? "1" : "0");
    }
    kids.push(h("g", null, wick, body));
  });
  // ступенчатый стоп (трейлинг)
  if (e) {
    var pts = e.points;
    var step = (M - A) / pts.length;
    var dpath = "";
    pts.forEach(function (j, ul) {
      var x0 = A + step * ul;
      var x1 = A + step * (ul + 1);
      dpath += "M " + x0 + " " + p(j) + " L " + x1 + " " + p(j) + " ";
      if (ul < pts.length - 1) dpath += "L " + x1 + " " + p(pts[ul + 1]) + " ";
    });
    kids.push(h("g", null,
      h("path", { d: dpath, fill: "none", stroke: "#34D399", strokeWidth: "1.4", strokeDasharray: "4 2" }),
      h("text", { x: A + 4, y: p(pts[0]) - 3, fontSize: "7.5", fill: "#34D399", fontFamily: "monospace", fontWeight: "700" }, e.label)
    ));
  }
  // уровни (тейки и стоп)
  i.forEach(function (U) {
    var r = p(U.p);
    kids.push(h("g", null,
      h("line", { x1: A, x2: M, y1: r, y2: r, stroke: U.color, strokeWidth: "0.8", strokeDasharray: "4 2", opacity: "0.85" }),
      h("rect", { x: M + 2, y: r - 6.5, width: f - 5, height: 13, rx: 3, fill: U.color }),
      h("text", { x: M + 6, y: r + 3.2, fontSize: "7.5", fill: "#100c04", fontFamily: "monospace", fontWeight: "700" }, U.label)
    ));
  });
  // тикер
  kids.push(h("text", { x: A + 2, y: 11, fontSize: "8", fill: "#D0CCC0", fontFamily: "monospace" }, t));

  return h("svg", {
    viewBox: "0 0 " + n + " " + c,
    style: { width: "100%", display: "block", borderRadius: 12, border: "1px solid " + d.border, background: "#0C0B07" },
    children: kids,
  });
}

/* ── «Живая» свеча: тик текущей цены строго в контексте графика ─────── */
// Двигается только последняя (формирующаяся) свеча — в пределах своего хая/лоя
// и не меняя направление (бычья остаётся бычьей). Прошлые свечи закрыты и неподвижны.
var tickerRAF = null;
function stopCandleTickers() {
  if (tickerRAF) { cancelAnimationFrame(tickerRAF); tickerRAF = null; }
}
function startCandleTickers() {
  stopCandleTickers();
  var bodies = [].slice.call(document.querySelectorAll("[data-live-body]"));
  if (!bodies.length) return;
  var nodes = bodies.map(function (b) {
    return {
      b: b,
      wick: b.parentNode ? b.parentNode.querySelector("[data-live-wick]") : null,
      open: +b.getAttribute("data-open"),
      close: +b.getAttribute("data-close"),
      hi: +b.getAttribute("data-hi"),   // координата хая (меньший y — выше цена)
      lo: +b.getAttribute("data-lo"),   // координата лоя (больший y — ниже цена)
      up: b.getAttribute("data-up") === "1",
      cur: +b.getAttribute("data-close"),
      vel: 0,
    };
  });
  function frame() {
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i];
      // мини случайное блуждание с возвратом к истинному close (mean-reverting тик)
      n.vel += (Math.random() - 0.5) * 0.5;     // случайный импульс рынка
      n.vel += (n.close - n.cur) * 0.045;       // тяга обратно к реальной цене
      n.vel *= 0.86;                            // затухание (вязкость)
      n.cur += n.vel;
      // в контексте: цена не выходит за хай/лой свечи
      if (n.cur < n.hi) { n.cur = n.hi; n.vel *= -0.4; }
      if (n.cur > n.lo) { n.cur = n.lo; n.vel *= -0.4; }
      // и не пересекает открытие — иначе сменилось бы направление свечи
      if (n.up && n.cur > n.open) n.cur = n.open;
      if (!n.up && n.cur < n.open) n.cur = n.open;
      // тело: между открытием и текущей ценой
      var by = Math.min(n.open, n.cur);
      var bh = Math.max(1.2, Math.abs(n.cur - n.open));
      n.b.setAttribute("y", by.toFixed(2));
      n.b.setAttribute("height", bh.toFixed(2));
      // фитиль слегка «дышит» к хаю/лою, всегда охватывая текущую цену
      if (n.wick) {
        var hiTick = n.hi - Math.random() * 1.1;
        var loTick = n.lo + Math.random() * 1.1;
        n.wick.setAttribute("y1", Math.min(hiTick, n.cur).toFixed(2));
        n.wick.setAttribute("y2", Math.max(loTick, n.cur).toFixed(2));
      }
    }
    tickerRAF = requestAnimationFrame(frame);
  }
  tickerRAF = requestAnimationFrame(frame);
}

      if (pos === seq.length) { pos = 0; goldBurst("GOLDEN TOUCH разблокирован"); }
    } else {
      pos = k === seq[0] ? 1 : 0;
    }
  });
})();

/* ── Аккаунт-чип и кнопка входа через Telegram ──────────────────────── */
function AccountChip() {
  var loggedIn = Identity.source === "miniapp" || Identity.source === "widget";
  var row = h("div", { className: "flex items-center justify-between", style: { marginTop: 14, gap: 10 } },
    h("div", { className: "flex items-center", style: { gap: 8, minWidth: 0 } },
      (Identity.user && Identity.user.photo_url)
        ? h("img", { src: Identity.user.photo_url, alt: "", style: { width: 26, height: 26, borderRadius: "50%", flexShrink: 0 } })
        : h("div", { style: { width: 26, height: 26, borderRadius: "50%", flexShrink: 0, background: d.panelHi, border: "1px solid " + d.border, textAlign: "center", lineHeight: "26px", fontSize: 13 } }, loggedIn ? "👤" : "🪪"),
      h("span", { className: "mono", style: { fontSize: 12, color: loggedIn ? d.gold : d.muted, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" } }, loggedIn ? userLabel() : "Гость")
    ),
    isAdmin()
      ? h("button", { onClick: openDevPanel, className: "opt mono", style: { fontSize: 11, color: d.gold, background: d.panelHi, border: "1px solid " + d.gold, borderRadius: 9, padding: "5px 10px" } }, "🛠 Дашборд")
      : null
  );
  // Кнопка входа через Telegram в браузере (если не залогинен)
  var box = h("div", null, row);
  if (!loggedIn) {
    if (CONFIG.botUsername) {
      var holder = h("div", { id: "tg-login-holder", style: { marginTop: 10 } });
      box.appendChild(holder);
      setTimeout(function () { mountTelegramWidget(holder); }, 0);
    } else {
      box.appendChild(h("div", { className: "mono", style: { marginTop: 8, fontSize: 11, color: d.muted } },
        "Вход через Telegram подключается после настройки бота."));
    }
  }
  return box;
}

function mountTelegramWidget(holder, size) {
  if (!holder || holder.querySelector("script,iframe")) return;
  var s = document.createElement("script");
  s.async = true;
  s.src = "https://telegram.org/js/telegram-widget.js?22";
  s.setAttribute("data-telegram-login", CONFIG.botUsername);
  s.setAttribute("data-size", size || "medium");
  s.setAttribute("data-radius", "10");
  s.setAttribute("data-onauth", "onTelegramAuth(user)");
  s.setAttribute("data-request-access", "write");
  holder.appendChild(s);
}

/* ── Панель разработчика: дашборд воронки ───────────────────────────── */
function openDevPanel() {
  closeDevPanel();
  track("dev_open");
  var overlay = h("div", { id: "dev-panel", style: { position: "fixed", inset: 0, zIndex: 80, background: "rgba(6,5,3,.96)", overflowY: "auto", WebkitOverflowScrolling: "touch" } });
  overlay.appendChild(h("div", { className: "w-full max-w-md", style: { margin: "0 auto", padding: "20px 18px 40px" }, id: "dev-body" },
    h("div", { className: "flex items-center justify-between" },
      h("h2", { className: "disp", style: { fontSize: 20, fontWeight: 700, color: d.gold } }, "🛠 Панель разработчика"),
      h("button", { onClick: closeDevPanel, className: "opt", style: { background: d.panel, border: "1px solid " + d.border, color: d.text, borderRadius: 10, padding: "6px 12px", fontSize: 13 } }, "Закрыть ✕")
    ),
    h("div", { className: "mono", style: { fontSize: 11, color: d.muted, marginTop: 6 } },
      "Вы: ", userLabel(), " · ваш Telegram ID: ",
      h("span", { style: { color: d.gold } }, String(Identity.user ? Identity.user.id : "—"))),
    h("div", { id: "dev-content", style: { marginTop: 16 } }, DashboardLoading())
  ));
  document.body.appendChild(overlay);
  loadDashboard();
}
function closeDevPanel() {
  var p = document.getElementById("dev-panel");
  if (p && p.parentNode) p.parentNode.removeChild(p);
}
function DashboardLoading() {
  return h("div", { className: "mono", style: { color: d.muted, fontSize: 13, padding: "20px 0", textAlign: "center" } }, "Загрузка статистики…");
}
function loadDashboard() {
  var mount = document.getElementById("dev-content");
  if (!mount) return;
  if (CONFIG.statsEndpoint) {
    fetchFunnelGlobal(function (data) {
      var m = document.getElementById("dev-content");
      if (!m) return;
      m.innerHTML = "";
      if (data) { data.scope = data.scope || "global"; m.appendChild(Dashboard(data)); }
      else {
        m.appendChild(h("div", { className: "mono", style: { color: d.red, fontSize: 12, marginBottom: 12 } }, "Глобальные данные недоступны — показываю локальные (это устройство)."));
        m.appendChild(Dashboard(computeFunnelLocal()));
      }
    });
  } else {
    mount.innerHTML = "";
    mount.appendChild(h("div", { className: "mono", style: { color: d.muted, fontSize: 12, marginBottom: 12 } }, "statsEndpoint не задан — показываю локальные данные (это устройство). Подключите Apps Script для агрегации по всем."));
    mount.appendChild(Dashboard(computeFunnelLocal()));
  }
}

function pct(a, b) { return b ? Math.round((a / b) * 100) : 0; }

function Dashboard(data) {
  var ev = data.events || {};
  var firstUsers = (ev[FUNNEL_STEPS[0].key] && ev[FUNNEL_STEPS[0].key].users) || data.totalUsers || 0;
  var wrap = h("div", null);

  // Заголовок-источник + сводка
  wrap.appendChild(h("div", { className: "flex", style: { gap: 10, marginBottom: 14 } },
    StatCard("Юзеров всего", String(data.totalUsers || firstUsers || 0)),
    StatCard("Источник", data.scope === "global" ? "Глобально" : "Локально"),
    StatCard("Дошли до CTA", pct((ev.cta_fxpro && ev.cta_fxpro.users) || 0, firstUsers) + "%")
  ));

  // Воронка
  wrap.appendChild(h("div", { className: "disp", style: { fontWeight: 700, fontSize: 15, margin: "6px 0 8px" } }, "Воронка прохождения"));
  var prev = null;
  FUNNEL_STEPS.forEach(function (step) {
    var users = (ev[step.key] && ev[step.key].users) || 0;
    var w = firstUsers ? Math.round((users / firstUsers) * 100) : 0;
    var conv = prev == null ? 100 : pct(users, prev);
    wrap.appendChild(h("div", { style: { marginBottom: 9 } },
      h("div", { className: "flex items-center justify-between", style: { fontSize: 12.5, marginBottom: 3 } },
        h("span", { style: { color: d.text } }, step.label),
        h("span", { className: "mono", style: { color: d.muted } }, users, prev != null ? h("span", { style: { color: conv >= 60 ? d.green : conv >= 30 ? d.gold : d.red } }, "  " + conv + "%") : "")),
      h("div", { style: { height: 8, background: d.panel, borderRadius: 5, overflow: "hidden" } },
        h("div", { style: { height: "100%", width: w + "%", background: "linear-gradient(90deg," + d.gold + "," + d.green + ")", transition: "width .5s" } }))
    ));
    prev = users;
  });

  // По модулям
  var mods = data.modules || {};
  if (Object.keys(mods).length) {
    wrap.appendChild(h("div", { className: "disp", style: { fontWeight: 700, fontSize: 15, margin: "18px 0 8px" } }, "По модулям"));
    fa.forEach(function (mod) {
      var m = mods[mod.id];
      if (!m) return;
      var avg = m.sumTotal ? Math.round((m.sumCorrect / m.sumTotal) * 100) : 0;
      wrap.appendChild(h("div", { className: "flex items-center", style: { gap: 8, fontSize: 12.5, marginBottom: 6 } },
        h("span", { style: { width: 20 } }, mod.icon),
        h("span", { style: { flex: 1, color: d.muted, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" } }, mod.title),
        h("span", { className: "mono", style: { color: d.text } }, "откр. " + (m.opens || 0)),
        h("span", { className: "mono", style: { color: d.green, width: 64, textAlign: "right" } }, "✓ " + (m.completes || 0)),
        h("span", { className: "mono", style: { color: d.gold, width: 50, textAlign: "right" } }, avg + "%")
      ));
    });
  }

  // Действия
  wrap.appendChild(h("div", { className: "flex", style: { gap: 10, marginTop: 20 } },
    h("button", { onClick: loadDashboard, className: "opt", style: { flex: 1, background: d.gold, color: "#1a1407", fontWeight: 700, fontSize: 14, padding: "12px", borderRadius: 11, border: "none" } }, "↻ Обновить"),
    h("button", { onClick: function () { exportEvents(); }, className: "opt", style: { flex: 1, background: d.panel, color: d.text, border: "1px solid " + d.border, fontSize: 14, padding: "12px", borderRadius: 11 } }, "⬇ Экспорт JSON")
  ));
  if (data.scope !== "global") {
    wrap.appendChild(h("button", { onClick: function () { if (confirm("Очистить локальный лог событий?")) { lsSet(EVENT_LOG_KEY, "[]"); loadDashboard(); } }, className: "opt", style: { width: "100%", marginTop: 10, background: "none", color: d.muted, fontSize: 12, padding: "8px", border: "none" } }, "Очистить локальный лог"));
  }
  return wrap;
}
function StatCard(label, value) {
  return h("div", { style: { flex: 1, background: d.panel, border: "1px solid " + d.border, borderRadius: 12, padding: "12px 8px", textAlign: "center" } },
    h("div", { className: "mono", style: { fontSize: 18, color: d.gold } }, value),
    h("div", { style: { fontSize: 10.5, color: d.muted, marginTop: 3 } }, label));
}
function exportEvents() {
  try {
    var blob = new Blob([lsGet(EVENT_LOG_KEY, "[]")], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "baha-events.json";
    a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
  } catch (e) {}
}

function render() {
  stopCandleTickers();
  var root = document.getElementById("root");
  root.innerHTML = "";

  var inner = h("div", { className: "w-full max-w-md px-5 pb-10 relative" });

  if (App.toast) {
    inner.appendChild(
      h("div", { className: "fixed left-0 right-0 flex justify-center z-50", style: { top: 14 } },
        h("div", { className: "pop mono", style: { background: d.panelHi, border: "1px solid " + d.gold, color: d.gold, padding: "8px 14px", borderRadius: 10, fontSize: 13, boxShadow: "0 8px 30px rgba(0,0,0,.5)" } }, App.toast)));
  }

  var screen = null;
  if (!isLoggedIn()) screen = ScreenAuth();   // обязательный вход через Telegram
  else if (App.screen === "start") screen = ScreenStart();
  else if (App.screen === "intro") screen = ScreenIntro();
  else if (App.screen === "map") screen = ScreenMap();
  else if (App.screen === "lesson") screen = ScreenLesson();
  else if (App.screen === "quiz") screen = ScreenQuiz();
  else if (App.screen === "moduleResult") screen = ScreenModuleResult();
  else if (App.screen === "final") screen = ScreenFinal();
  if (screen) {
    if (App.fx) screen.className += " " + App.fx; // анимация перехода для этого этапа
    inner.appendChild(screen);
  }
  App.fx = null; // анимация одноразовая — не повторять на внутренних перерисовках

  var outer = h("div", { className: "w-full flex justify-center", style: { background: d.bg, color: d.text, minHeight: "100vh", fontFamily: "Inter, system-ui, sans-serif" } }, inner);
  root.appendChild(outer);
  startCandleTickers(); // оживляем последнюю свечу на всех видимых графиках
}

/* ── Старт приложения ───────────────────────────────────────────────── */
function init() {
  resolveIdentity();
  track("app_open");
  if (Identity.source === "miniapp") track("login", { method: "miniapp" });
  // Авто-открытие панели по секретной ссылке #dev=СЕКРЕТ (для админов)
  if ((location.hash || "").indexOf("dev") !== -1 && isAdmin()) setTimeout(openDevPanel, 200);
  window.addEventListener("hashchange", function () {
    if ((location.hash || "").indexOf("dev") !== -1 && isAdmin()) openDevPanel();
  });
  render();
}

init();

</script>
